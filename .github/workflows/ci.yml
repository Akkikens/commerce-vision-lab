name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI installs only the core package (no torch, no model downloads). Every model sits
# behind an interface with a deterministic stub, so the suite runs in seconds. The
# measured results in results/*.json come from running scripts/ locally.
jobs:
  test:
    name: Lint + tests (core install, stub backends)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]" faiss-cpu
      - name: Package imports without torch
        run: python -c "import cvlab.api, sys; assert 'torch' not in sys.modules"
      - run: ruff check src scripts tests
      - run: pytest -v

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cvlab .
      - name: Run container and hit /health and /search
        run: |
          docker run -d -p 8000:8000 --name cvlab cvlab
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep '"backend":"stub"'
          curl -sf -X POST localhost:8000/search -H 'content-type: application/json' \
            -d '{"text":"red dress","k":3}' | grep '"hits"'
          docker logs cvlab
