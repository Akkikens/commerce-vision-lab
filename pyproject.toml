[project]
name = "commerce-vision-lab"
version = "0.1.0"
description = "Learning project: CLIP/SigLIP product understanding, visual search, product image generation with a quality gate, and guarded LLM product copy for an apparel catalog."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akshay Kalapgar" }]
requires-python = ">=3.11,<3.13"
# Core deps only: enough to run the API with stub backends and the test suite.
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pillow>=10.3",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Real models: CLIP/SigLIP embeddings, FAISS, linear probes, dataset loading.
ml = [
  "torch>=2.3",
  "torchvision>=0.18",
  "open_clip_torch>=2.26",
  "faiss-cpu>=1.8",
  "scikit-learn>=1.5",
  "pyarrow>=16",
  "huggingface_hub>=0.24",
  "fsspec>=2024.6",
]
# Image generation: background removal + diffusion.
gen = [
  "commerce-vision-lab[ml]",
  "rembg>=2.0.57",
  "onnxruntime>=1.18",
  "diffusers>=0.30",
  "transformers>=4.44",
  "accelerate>=0.33",
]
# LLM providers (only needed for the real providers; the stub needs nothing).
llm = ["anthropic>=0.40", "openai>=1.40", "transformers>=4.44", "torch>=2.3"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
